# CI: 9-job matrix — 3 Deno v2.9 + 3 Bun + 3 Node 22 (Linux/macOS/Windows)
# No Chromium, no Playwright, no external services
# E2E tests (tests/e2e/) excluded — run locally via deno task test:e2e
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ───────────────── Deno ─────────────────
  test-deno:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache src/mod.ts tests/ --minimum-dependency-age=0

      - name: Check
        run: deno check src/mod.ts

      - name: Lint
        run: deno lint src/

      - name: Test (Deno)
        run: deno test -A --no-check tests/unit tests/integration

  # ───────────────── Bun ─────────────────
  test-bun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        continue-on-error: true
        run: bun install || true

      - name: Test (Bun)
        run: bun test --preload ./tests/unit/dom-setup.ts tests/unit tests/integration

  # ───────────────── Node.js 22+ ─────────────────
  test-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Test (Node.js)
        run: node --import tsx --test-force-exit test-node.mjs

  # ───────────────── Bundle size gate (ubuntu only) ─────────────────
  size-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Bundle size gate (+5% vs committed baseline)
        run: node scripts/size-baseline/check.mjs

  # ───────────────── Bench gate (ubuntu only; loose budget vs reference CPU) ─────────────────
  bench-check:
    runs-on: ubuntu-latest
    env:
      # Actions hosts ≠ Apple reference CPU used for committed baseline
      BENCH_BUDGET_PCT: "300"
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache src/mod.ts tests/ --minimum-dependency-age=0

      - name: Bench regression gate (signal / Effect / For / insert)
        run: node scripts/bench-baseline/check.mjs

  # ───────────────── Compiler coverage / golden gate (ubuntu only) ─────────────────
  compiler-coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache src/mod.ts tests/ scripts/compiler-coverage/ --minimum-dependency-age=0

      - name: Compiler static-subtree coverage + golden gate
        run: deno task compiler:coverage:check
