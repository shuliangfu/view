# CI layout:
# - 9-job unit/integration matrix: 3 Deno v2.9 + 3 Bun + 3 Node 22 × (Linux/macOS/Windows)
#   → NO Chromium / Playwright; do NOT fold tests/e2e into those jobs (would drag Windows /
#     browser-less runners and inflate flake surface).
# - e2e-examples (ubuntu-24.04 only): Playwright Chromium + examples browser E2E; failure fails the workflow.
# Local: deno task test:e2e  |  full Deno suite (unit+integration+e2e): deno test -A tests
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  # ───────────────── Deno ─────────────────
  test-deno:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache src/mod.ts tests/ --minimum-dependency-age=0

      - name: Check
        run: deno check src/mod.ts

      - name: Lint
        run: deno lint src/

      # Unit + integration only — examples browser E2E lives in job `e2e-examples` (ubuntu).
      - name: Test (Deno)
        run: deno test -A --no-check tests/unit tests/integration

  # ───────────────── Bun ─────────────────
  test-bun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        continue-on-error: true
        run: bun install || true

      - name: Test (Bun)
        run: bun test --preload ./tests/unit/dom-setup.ts tests/unit tests/integration

  # ───────────────── Node.js 22+ ─────────────────
  test-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Test (Node.js)
        run: node --import tsx --test-force-exit test-node.mjs

  # ───────────────── Bundle size gate (ubuntu only) ─────────────────
  size-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Bundle size gate (+5% vs committed baseline)
        run: node scripts/size-baseline/check.mjs

  # ───────────────── Consumer / examples bundle gate (ubuntu only; independent of size-check) ─────────────────
  consumer-bundle-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Consumer bundle analyze gate (+5% vs committed baseline)
        run: node scripts/consumer-bundle/check.mjs

  # ───────────────── Bench gate (ubuntu only; loose budget vs reference CPU) ─────────────────
  bench-check:
    runs-on: ubuntu-latest
    env:
      # Actions hosts ≠ Apple reference CPU used for committed baseline
      BENCH_BUDGET_PCT: "300"
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache src/mod.ts tests/ --minimum-dependency-age=0

      - name: Bench regression gate (signal / Effect / For / insert)
        run: node scripts/bench-baseline/check.mjs

  # ───────────────── Compiler coverage / golden gate (ubuntu only) ─────────────────
  compiler-coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - name: Cache dependencies
        continue-on-error: true
        run: deno cache src/mod.ts tests/ scripts/compiler-coverage/ --minimum-dependency-age=0

      - name: Compiler static-subtree coverage + golden gate
        run: deno task compiler:coverage:check

  # ───────────────── Examples browser E2E (Ubuntu 24.04 + Chromium / Playwright only) ─────────────────
  # Keep this OUT of the 9-job matrix: needs Playwright Chromium + examples `deno task dev`.
  # Windows / macOS / Bun / Node matrix jobs stay browser-free on purpose.
  # Pin ubuntu-24.04: ubuntu-latest is 26.04; Playwright 1.59.1 rejects chromium + --with-deps there
  # ("does not support chromium on ubuntu26.04-x64"). Match @dreamer/test's playwright pin.
  e2e-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      # Do not cache examples/: routers.tsx is generated in E2E beforeAll, missing at cold cache.
      - name: Cache dependencies
        continue-on-error: true
        run: deno cache src/mod.ts tests/ --minimum-dependency-age=0

      - name: Install Playwright Chromium (+ Ubuntu 24.04 deps)
        # Same pin as @dreamer/test / dweb CI. --with-deps is safe on 24.04; not on 26.04.
        run: npx -y playwright@1.59.1 install --with-deps chromium

      - name: Examples browser E2E (fail = red)
        # Same command as local `deno task test:e2e`. Assertions are not relaxed for CI.
        run: deno task test:e2e
